<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reportfy - Sign In</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="card">

        <h1>REPORTFY</h1>

        <p class="sub">
            Sign-in link
        </p>

        <p
            id="finishMsg"
            style="
                color: var(--text-muted, #94a3b8);
                margin: 20px 0;
                line-height: 1.6;
            ">

            This sign-in link is no longer required.
            Please return to the login page and sign in
            using your email and password or Google.

        </p>


        <a
            href="index.html"
            class="btn"
            style="
                display: inline-block;
                text-decoration: none;
                background: #f5a623;
                color: #0a0e17;
                padding: 12px 25px;
                border-radius: 8px;
                font-weight: 600;
            ">

            Back to Sign In

        </a>

    </div>


</body>

</html>
