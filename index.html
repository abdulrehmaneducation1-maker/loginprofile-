<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="stylee.css">
</head>
<body>

  <div class="card">
    <h1 id="cardTitle">SIGN IN</h1>
    <p class="sub" id="cardSub">Choose how you'd like to sign in.</p>

    <div class="social-row">
      <button type="button" id="googleBtn" class="social-btn google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 16.02 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 1.98.96 4.96l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>

    <div class="divider"><span>or use your email</span></div>

    <!-- Email + Password (default email mode) -->
    <form id="emailPasswordForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="e.g. name@gmail.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
      <button type="submit" id="emailSignInBtn">Sign In</button>
    </form>

    <div class="link-row">
      <button type="button" id="toggleSignUpBtn" class="link-btn">Create an account instead</button>
      <button type="button" id="useLinkBtn" class="link-btn">Email me a sign-in link instead</button>
    </div>

    <!-- Email link / passwordless mode (hidden by default) -->
    <form id="emailLinkForm" class="hidden">
      <label for="linkEmail">Email</label>
      <input type="email" id="linkEmail" placeholder="e.g. name@gmail.com" required>
      <button type="submit" id="sendLinkBtn">Send Sign-In Link</button>
    </form>
    <div class="link-row hidden" id="backToPasswordRow">
      <button type="button" id="backToPasswordBtn" class="link-btn">Use email & password instead</button>
    </div>

    <div class="divider"><span>or use your phone</span></div>

    <!-- STEP 1: phone number -->
    <form id="phoneForm">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. +923001234567" required>
      <button type="submit" id="sendBtn">Send Code</button>
    </form>

    <!-- STEP 2: 6-digit code (hidden until code is sent) -->
    <form id="codeForm" class="hidden">
      <label for="code">6-Digit Code</label>
      <input type="text" id="code" placeholder="e.g. 123456" inputmode="numeric" maxlength="6" required>
      <button type="submit" id="verifyBtn">Verify & Sign In</button>
    </form>

    <!-- Required by Firebase Phone Auth, stays invisible -->
    <div id="recaptcha-container"></div>

    <p id="statusMsg" class="status"></p>
    <p id="limitMsg" class="limit"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script src="Firebase config.js"></script>
  <script src="App.js"></script>
</body>
</html>
